<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Face Tracking - Daniel Viafara</title>

  <!-- A-Frame primero, luego MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    a-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* ── UI OVERLAY ── */
    #ui {
      position: fixed;
      z-index: 100;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* TOP BAR */
    #topbar {
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }

    #topbar h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00D4FF;
    }

    #topbar span {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    /* BOTTOM PANEL */
    #bottom {
      pointer-events: all;
      padding: 16px 16px 32px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    /* EFFECTS LABEL */
    #effects-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
      text-align: center;
    }

    /* EFFECTS SELECTOR */
    #effects-grid {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .effect-btn {
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 70px;
      backdrop-filter: blur(8px);
    }

    .effect-btn .icon { font-size: 22px; }
    .effect-btn .label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.6); }

    .effect-btn:hover, .effect-btn.active {
      background: rgba(0, 212, 255, 0.2);
      border-color: #00D4FF;
      color: #00D4FF;
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(0,212,255,0.3);
    }

    .effect-btn.active .label { color: #00D4FF; }

    /* CAPTURE BUTTON */
    #capture-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #capture-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 24px rgba(255,255,255,0.2);
    }

    #capture-btn:active {
      transform: scale(0.9);
      background: #00D4FF;
    }

    #share-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    #share-btn:hover {
      background: rgba(0,212,255,0.2);
      border-color: #00D4FF;
    }

    /* FLASH EFFECT */
    #flash {
      position: fixed;
      inset: 0;
      background: white;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }

    #flash.active { opacity: 1; }

    /* TOAST */
    #toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0,212,255,0.9);
      color: #000;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 300;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* PREVIEW MODAL */
    #preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 400;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    #preview-modal.show { display: flex; }

    #preview-img {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      border: 2px solid #00D4FF;
    }

    #preview-actions {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      padding: 12px 24px;
      border-radius: 24px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.primary {
      background: #00D4FF;
      color: #000;
    }

    .modal-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .modal-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

<!-- SPLASH (requerido iOS) -->
<div id="splash" style="
  position:fixed;inset:0;z-index:9999;
  background:#0a0a0a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;
">
  <div style="font-size:64px">⚡</div>
  <div style="font-size:22px;font-weight:700;color:#00D4FF;letter-spacing:3px;">AR FACE</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.5);text-align:center;padding:0 40px;">
    Toca para activar la cámara y comenzar
  </div>
  <button onclick="startAR()" style="
    margin-top:8px;
    padding:16px 48px;
    background:#00D4FF;
    border:none;border-radius:32px;
    font-size:16px;font-weight:700;
    color:#000;cursor:pointer;
    box-shadow:0 0 32px rgba(0,212,255,0.4);
  ">Iniciar AR 🚀</button>
</div>

<!-- FLASH -->
<div id="flash"></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- PREVIEW MODAL -->
<div id="preview-modal">
  <img id="preview-img" src="" alt="Captura AR" />
  <div id="preview-actions">
    <button class="modal-btn primary" onclick="downloadPhoto()">⬇️ Guardar</button>
    <button class="modal-btn secondary" onclick="sharePhoto()">🔗 Compartir</button>
    <button class="modal-btn secondary" onclick="closePreview()">✕ Cerrar</button>
  </div>
</div>

<!-- AR SCENE -->
<a-scene
  mindar-face="autoStart: false"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, preserveDrawingBuffer: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <!-- Colores usados como materiales -->
  </a-assets>

  <a-camera active="false" position="0 0 0"></a-camera>

  <!-- ══════════════════════════════════════ -->
  <!--  EFECTO 1: GAFAS DE SOL (anchor 10 = nariz, 33/263 = ojos) -->
  <!-- ══════════════════════════════════════ -->

  <!-- Ojo izquierdo -->
  <a-entity id="glasses-left" mindar-face-target="anchorIndex: 33" visible="true">
    <a-torus position="-0.05 0 0.05" radius="0.055" radius-tubular="0.008" color="#111111" material="opacity: 0.95"></a-torus>
    <a-plane position="-0.05 0 0.04" width="0.1" height="0.06" color="#1a1a2e" material="opacity: 0.7; transparent: true"></a-plane>
  </a-entity>

  <!-- Ojo derecho -->
  <a-entity id="glasses-right" mindar-face-target="anchorIndex: 263" visible="true">
    <a-torus position="0.05 0 0.05" radius="0.055" radius-tubular="0.008" color="#111111" material="opacity: 0.95"></a-torus>
    <a-plane position="0.05 0 0.04" width="0.1" height="0.06" color="#1a1a2e" material="opacity: 0.7; transparent: true"></a-plane>
  </a-entity>

  <!-- Puente gafas -->
  <a-entity id="glasses-bridge" mindar-face-target="anchorIndex: 1" visible="true">
    <a-cylinder position="0 0.02 0.07" radius="0.004" height="0.08" rotation="0 0 90" color="#111111"></a-cylinder>
  </a-entity>

  <!-- ══════════════════════════════════════ -->
  <!--  EFECTO 2: CORONA (anchor 10 = frente) -->
  <!-- ══════════════════════════════════════ -->

  <a-entity id="crown" mindar-face-target="anchorIndex: 10" visible="false">
    <!-- Base corona -->
    <a-cylinder position="0 0.28 0" radius="0.13" height="0.04" color="#FFD700" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
    <!-- Picos -->
    <a-cone position="-0.1 0.33 0" radius-bottom="0.025" radius-top="0" height="0.06" color="#FFD700" material="metalness: 0.8"></a-cone>
    <a-cone position="0 0.35 0" radius-bottom="0.03" radius-top="0" height="0.08" color="#FFD700" material="metalness: 0.8"></a-cone>
    <a-cone position="0.1 0.33 0" radius-bottom="0.025" radius-top="0" height="0.06" color="#FFD700" material="metalness: 0.8"></a-cone>
    <!-- Gemas -->
    <a-sphere position="-0.1 0.34 0" radius="0.015" color="#FF1744" material="metalness: 0.5"></a-sphere>
    <a-sphere position="0 0.37 0" radius="0.018" color="#00D4FF" material="metalness: 0.5"></a-sphere>
    <a-sphere position="0.1 0.34 0" radius="0.015" color="#FF1744" material="metalness: 0.5"></a-sphere>
    <!-- Partículas flotando -->
    <a-sphere position="-0.15 0.4 0" radius="0.008" color="#FFD700"
      animation="property: position; to: -0.12 0.46 0; dur: 1500; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
    <a-sphere position="0.15 0.4 0" radius="0.008" color="#FFD700"
      animation="property: position; to: 0.12 0.46 0; dur: 1200; loop: true; dir: alternate; easing: easeInOutSine"></a-sphere>
  </a-entity>

  <!-- ══════════════════════════════════════ -->
  <!--  EFECTO 3: NARIZ DE PERRO + OREJAS -->
  <!-- ══════════════════════════════════════ -->

  <!-- Nariz -->
  <a-entity id="dog-nose" mindar-face-target="anchorIndex: 1" visible="false">
    <a-sphere position="0 -0.04 0.05" radius="0.035" color="#3d2b1f"></a-sphere>
    <a-sphere position="-0.015 -0.03 0.07" radius="0.012" color="#1a0f0a"></a-sphere>
    <a-sphere position="0.015 -0.03 0.07" radius="0.012" color="#1a0f0a"></a-sphere>
  </a-entity>

  <!-- Oreja izquierda -->
  <a-entity id="dog-ear-left" mindar-face-target="anchorIndex: 127" visible="false">
    <a-sphere position="-0.08 0.12 -0.02" radius="0.07" scale="0.7 1.1 0.4" color="#c8a882"></a-sphere>
  </a-entity>

  <!-- Oreja derecha -->
  <a-entity id="dog-ear-right" mindar-face-target="anchorIndex: 356" visible="false">
    <a-sphere position="0.08 0.12 -0.02" radius="0.07" scale="0.7 1.1 0.4" color="#c8a882"></a-sphere>
  </a-entity>

  <!-- ══════════════════════════════════════ -->
  <!--  EFECTO 4: CYBER / HOLO  -->
  <!-- ══════════════════════════════════════ -->

  <!-- Visor cyber ojo izquierdo -->
  <a-entity id="cyber-left" mindar-face-target="anchorIndex: 33" visible="false">
    <a-plane position="-0.03 0 0.06" width="0.13" height="0.055" color="#00D4FF"
      material="opacity: 0.25; transparent: true; side: double"></a-plane>
    <a-plane position="-0.03 0 0.065" width="0.13" height="0.055" color="#00D4FF"
      material="wireframe: true; opacity: 0.6; transparent: true"></a-plane>
    <!-- Scan line animado -->
    <a-plane position="-0.03 0 0.07" width="0.13" height="0.005" color="#00FFFF"
      material="opacity: 0.9; transparent: true"
      animation="property: position; from: -0.03 -0.025 0.07; to: -0.03 0.025 0.07; dur: 800; loop: true; dir: alternate; easing: linear"></a-plane>
  </a-entity>

  <!-- Visor cyber ojo derecho -->
  <a-entity id="cyber-right" mindar-face-target="anchorIndex: 263" visible="false">
    <a-plane position="0.03 0 0.06" width="0.13" height="0.055" color="#00D4FF"
      material="opacity: 0.25; transparent: true; side: double"></a-plane>
    <a-plane position="0.03 0 0.065" width="0.13" height="0.055" color="#00D4FF"
      material="wireframe: true; opacity: 0.6; transparent: true"></a-plane>
    <a-plane position="0.03 0 0.07" width="0.13" height="0.005" color="#00FFFF"
      material="opacity: 0.9; transparent: true"
      animation="property: position; from: 0.03 -0.025 0.07; to: 0.03 0.025 0.07; dur: 800; loop: true; dir: alternate; easing: linear"></a-plane>
  </a-entity>

  <!-- Holo text frente -->
  <a-entity id="cyber-text" mindar-face-target="anchorIndex: 10" visible="false">
    <a-text value="DANIEL VIAFARA\nSOFTWARE ENGINEER" align="center" color="#00D4FF"
      position="0 0.35 0" scale="0.18 0.18 0.18" font="mozillavr"
      animation="property: material.opacity; from: 0.3; to: 1; dur: 1000; loop: true; dir: alternate"></a-text>
  </a-entity>

</a-scene>

<!-- UI OVERLAY -->
<div id="ui">
  <div id="topbar">
    <h1>⚡ AR Face</h1>
    <span>danielviafara.github.io</span>
  </div>

  <div id="bottom">
    <div id="effects-label">Selecciona un efecto</div>

    <div id="effects-grid">
      <button class="effect-btn active" onclick="setEffect('glasses')" id="btn-glasses">
        <span class="icon">🕶️</span>
        <span class="label">Gafas</span>
      </button>
      <button class="effect-btn" onclick="setEffect('crown')" id="btn-crown">
        <span class="icon">👑</span>
        <span class="label">Corona</span>
      </button>
      <button class="effect-btn" onclick="setEffect('dog')" id="btn-dog">
        <span class="icon">🐶</span>
        <span class="label">Perro</span>
      </button>
      <button class="effect-btn" onclick="setEffect('cyber')" id="btn-cyber">
        <span class="icon">🤖</span>
        <span class="label">Cyber</span>
      </button>
      <button class="effect-btn" onclick="setEffect('none')" id="btn-none">
        <span class="icon">✕</span>
        <span class="label">Ninguno</span>
      </button>
    </div>

    <div id="capture-row">
      <button id="share-btn" onclick="openPreview()" title="Ver última foto">🖼️</button>
      <button id="capture-btn" onclick="capturePhoto()" title="Capturar foto">📸</button>
      <button id="share-btn" onclick="sharePhoto()" title="Compartir">🔗</button>
    </div>
  </div>
</div>

<script>
  // ── START AR (requerido iOS Safari) ──
  function startAR() {
    document.getElementById('splash').style.display = 'none';
    const scene = document.querySelector('a-scene');
    scene.components['mindar-face'].start();
  }

  // ── EFFECTS MAP ──
  const effects = {
    glasses: ['glasses-left', 'glasses-right', 'glasses-bridge'],
    crown:   ['crown'],
    dog:     ['dog-nose', 'dog-ear-left', 'dog-ear-right'],
    cyber:   ['cyber-left', 'cyber-right', 'cyber-text'],
    none:    []
  };

  let currentEffect = 'glasses';
  let lastPhotoDataUrl = null;

  function setEffect(name) {
    // Ocultar todos
    Object.values(effects).flat().forEach(id => {
      const el = document.getElementById(id);
      if (el) el.setAttribute('visible', 'false');
    });

    // Mostrar los del efecto seleccionado
    if (effects[name]) {
      effects[name].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.setAttribute('visible', 'true');
      });
    }

    // Actualizar botones activos
    document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById('btn-' + name);
    if (activeBtn) activeBtn.classList.add('active');

    currentEffect = name;
    showToast('Efecto: ' + name.charAt(0).toUpperCase() + name.slice(1));
  }

  // ── CAPTURA DE FOTO ──
  function capturePhoto() {
    const flash = document.getElementById('flash');
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 150);

    try {
      const scene = document.querySelector('a-scene');
      const glCanvas = scene && scene.canvas;
      const video = document.querySelector('video');

      if (!glCanvas && !video) { showToast('⚠️ Cámara no lista'); return; }

      const w = (glCanvas || video).width || video.videoWidth || 640;
      const h = (glCanvas || video).height || video.videoHeight || 480;

      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const ctx = out.getContext('2d');

      if (video && video.readyState >= 2) ctx.drawImage(video, 0, 0, w, h);
      if (glCanvas) { try { ctx.drawImage(glCanvas, 0, 0, w, h); } catch(e) {} }

      lastPhotoDataUrl = out.toDataURL('image/png');
      showToast('📸 Foto capturada!');
    } catch (e) {
      showToast('⚠️ Error: ' + e.message);
    }
  }

  function openPreview() {
    if (!lastPhotoDataUrl) { showToast('Toma una foto primero 📸'); return; }
    document.getElementById('preview-img').src = lastPhotoDataUrl;
    document.getElementById('preview-modal').classList.add('show');
  }

  function closePreview() {
    document.getElementById('preview-modal').classList.remove('show');
  }

  function downloadPhoto() {
    if (!lastPhotoDataUrl) return;
    const a = document.createElement('a');
    a.href = lastPhotoDataUrl;
    a.download = 'ar-face-' + Date.now() + '.png';
    a.click();
    showToast('⬇️ Guardando...');
    closePreview();
  }

  async function sharePhoto() {
    if (!lastPhotoDataUrl) { showToast('Toma una foto primero 📸'); return; }
    try {
      const blob = await (await fetch(lastPhotoDataUrl)).blob();
      const file = new File([blob], 'ar-face.png', { type: 'image/png' });
      if (navigator.share && navigator.canShare({ files: [file] })) {
        await navigator.share({ title: 'AR Face - Daniel Viafara', files: [file] });
      } else {
        downloadPhoto();
      }
    } catch (e) {
      downloadPhoto();
    }
  }

  // ── TOAST ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>

</body>
</html>
