<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Face - Daniel Viafara</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; }

    #ui {
      position:fixed; z-index:100;
      width:100%; height:100%;
      pointer-events:none;
      display:flex; flex-direction:column;
      justify-content:space-between;
      font-family:'Segoe UI',sans-serif;
    }

    #topbar {
      pointer-events:all;
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px;
      background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);
    }
    #topbar h1 { font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#00D4FF; }
    #topbar span { font-size:11px; color:rgba(255,255,255,0.5); }

    #bottom {
      pointer-events:all;
      padding:16px 16px 40px;
      background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
    }
    #effects-label {
      font-size:11px; letter-spacing:2px; text-transform:uppercase;
      color:rgba(255,255,255,0.4); margin-bottom:10px; text-align:center;
    }
    #effects-grid {
      display:flex; gap:10px; justify-content:center;
      flex-wrap:wrap; margin-bottom:18px;
    }
    .effect-btn {
      background:rgba(255,255,255,0.08);
      border:1.5px solid rgba(255,255,255,0.15);
      border-radius:12px; padding:10px 14px; color:#fff;
      cursor:pointer; transition:all 0.2s;
      display:flex; flex-direction:column; align-items:center; gap:4px; min-width:68px;
      backdrop-filter:blur(8px);
    }
    .effect-btn .icon { font-size:22px; }
    .effect-btn .lbl { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.6); }
    .effect-btn.active {
      background:rgba(0,212,255,0.2); border-color:#00D4FF;
      transform:translateY(-2px); box-shadow:0 0 16px rgba(0,212,255,0.3);
    }
    .effect-btn.active .lbl { color:#00D4FF; }

    #capture-row { display:flex; justify-content:center; align-items:center; gap:20px; }
    #capture-btn {
      width:68px; height:68px; border-radius:50%;
      background:#fff; border:4px solid rgba(255,255,255,0.3);
      cursor:pointer; font-size:28px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 24px rgba(255,255,255,0.2); transition:all 0.15s;
    }
    #capture-btn:active { transform:scale(0.9); background:#00D4FF; }
    .side-btn {
      width:48px; height:48px; border-radius:50%;
      background:rgba(255,255,255,0.1);
      border:1.5px solid rgba(255,255,255,0.2);
      cursor:pointer; font-size:20px;
      display:flex; align-items:center; justify-content:center;
      transition:all 0.2s;
    }

    #flash {
      position:fixed; inset:0; background:white; z-index:200;
      opacity:0; pointer-events:none; transition:opacity 0.1s;
    }
    #flash.active { opacity:1; }

    #toast {
      position:fixed; top:80px; left:50%;
      transform:translateX(-50%) translateY(-20px);
      background:rgba(0,212,255,0.9); color:#000;
      padding:10px 20px; border-radius:20px;
      font-size:13px; font-weight:600; z-index:300;
      opacity:0; transition:all 0.3s; pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    #preview-modal {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.92); z-index:400;
      align-items:center; justify-content:center; flex-direction:column; gap:20px;
    }
    #preview-modal.show { display:flex; }
    #preview-img { max-width:90vw; max-height:70vh; border-radius:12px; border:2px solid #00D4FF; }
    #preview-actions { display:flex; gap:12px; }
    .modal-btn {
      padding:12px 24px; border-radius:24px; border:none;
      font-size:14px; font-weight:600; cursor:pointer;
    }
    .modal-btn.primary { background:#00D4FF; color:#000; }
    .modal-btn.secondary { background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<div id="flash"></div>
<div id="toast"></div>

<div id="preview-modal">
  <img id="preview-img" src="" alt="Captura AR" />
  <div id="preview-actions">
    <button class="modal-btn primary" onclick="downloadPhoto()">⬇️ Guardar</button>
    <button class="modal-btn secondary" onclick="sharePhoto()">🔗 Compartir</button>
    <button class="modal-btn secondary" onclick="closePreview()">✕ Cerrar</button>
  </div>
</div>

<a-scene
  mindar-face
  color-space="sRGB"
  renderer="colorManagement: true; preserveDrawingBuffer: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera active="false" position="0 0 0"></a-camera>

  <!-- GAFAS -->
  <a-entity id="glasses-left" mindar-face-target="anchorIndex: 33" visible="true">
    <a-torus position="-0.05 0 0.05" radius="0.055" radius-tubular="0.008" color="#111111"></a-torus>
    <a-plane position="-0.05 0 0.04" width="0.1" height="0.06" color="#1a1a2e" material="opacity:0.7;transparent:true"></a-plane>
  </a-entity>
  <a-entity id="glasses-right" mindar-face-target="anchorIndex: 263" visible="true">
    <a-torus position="0.05 0 0.05" radius="0.055" radius-tubular="0.008" color="#111111"></a-torus>
    <a-plane position="0.05 0 0.04" width="0.1" height="0.06" color="#1a1a2e" material="opacity:0.7;transparent:true"></a-plane>
  </a-entity>
  <a-entity id="glasses-bridge" mindar-face-target="anchorIndex: 1" visible="true">
    <a-cylinder position="0 0.02 0.07" radius="0.004" height="0.08" rotation="0 0 90" color="#111111"></a-cylinder>
  </a-entity>

  <!-- CORONA -->
  <a-entity id="crown" mindar-face-target="anchorIndex: 10" visible="false">
    <a-cylinder position="0 0.28 0" radius="0.13" height="0.04" color="#FFD700" material="metalness:0.8;roughness:0.2"></a-cylinder>
    <a-cone position="-0.1 0.33 0" radius-bottom="0.025" radius-top="0" height="0.06" color="#FFD700"></a-cone>
    <a-cone position="0 0.35 0" radius-bottom="0.03" radius-top="0" height="0.08" color="#FFD700"></a-cone>
    <a-cone position="0.1 0.33 0" radius-bottom="0.025" radius-top="0" height="0.06" color="#FFD700"></a-cone>
    <a-sphere position="-0.1 0.34 0" radius="0.015" color="#FF1744"></a-sphere>
    <a-sphere position="0 0.37 0" radius="0.018" color="#00D4FF"></a-sphere>
    <a-sphere position="0.1 0.34 0" radius="0.015" color="#FF1744"></a-sphere>
    <a-sphere position="-0.15 0.4 0" radius="0.008" color="#FFD700"
      animation="property:position;to:-0.12 0.46 0;dur:1500;loop:true;dir:alternate;easing:easeInOutSine"></a-sphere>
    <a-sphere position="0.15 0.4 0" radius="0.008" color="#FFD700"
      animation="property:position;to:0.12 0.46 0;dur:1200;loop:true;dir:alternate;easing:easeInOutSine"></a-sphere>
  </a-entity>

  <!-- PERRO -->
  <a-entity id="dog-nose" mindar-face-target="anchorIndex: 1" visible="false">
    <a-sphere position="0 -0.04 0.05" radius="0.035" color="#3d2b1f"></a-sphere>
    <a-sphere position="-0.015 -0.03 0.07" radius="0.012" color="#1a0f0a"></a-sphere>
    <a-sphere position="0.015 -0.03 0.07" radius="0.012" color="#1a0f0a"></a-sphere>
  </a-entity>
  <a-entity id="dog-ear-left" mindar-face-target="anchorIndex: 127" visible="false">
    <a-sphere position="-0.08 0.12 -0.02" radius="0.07" scale="0.7 1.1 0.4" color="#c8a882"></a-sphere>
  </a-entity>
  <a-entity id="dog-ear-right" mindar-face-target="anchorIndex: 356" visible="false">
    <a-sphere position="0.08 0.12 -0.02" radius="0.07" scale="0.7 1.1 0.4" color="#c8a882"></a-sphere>
  </a-entity>

  <!-- CYBER -->
  <a-entity id="cyber-left" mindar-face-target="anchorIndex: 33" visible="false">
    <a-plane position="-0.03 0 0.06" width="0.13" height="0.055" color="#00D4FF" material="opacity:0.25;transparent:true"></a-plane>
    <a-plane position="-0.03 0 0.065" width="0.13" height="0.055" color="#00D4FF" material="wireframe:true;opacity:0.6;transparent:true"></a-plane>
    <a-plane position="-0.03 0 0.07" width="0.13" height="0.005" color="#00FFFF" material="opacity:0.9;transparent:true"
      animation="property:position;from:-0.03 -0.025 0.07;to:-0.03 0.025 0.07;dur:800;loop:true;dir:alternate;easing:linear"></a-plane>
  </a-entity>
  <a-entity id="cyber-right" mindar-face-target="anchorIndex: 263" visible="false">
    <a-plane position="0.03 0 0.06" width="0.13" height="0.055" color="#00D4FF" material="opacity:0.25;transparent:true"></a-plane>
    <a-plane position="0.03 0 0.065" width="0.13" height="0.055" color="#00D4FF" material="wireframe:true;opacity:0.6;transparent:true"></a-plane>
    <a-plane position="0.03 0 0.07" width="0.13" height="0.005" color="#00FFFF" material="opacity:0.9;transparent:true"
      animation="property:position;from:0.03 -0.025 0.07;to:0.03 0.025 0.07;dur:800;loop:true;dir:alternate;easing:linear"></a-plane>
  </a-entity>
  <a-entity id="cyber-text" mindar-face-target="anchorIndex: 10" visible="false">
    <a-text value="DANIEL VIAFARA" align="center" color="#00D4FF"
      position="0 0.35 0" scale="0.18 0.18 0.18"
      animation="property:material.opacity;from:0.3;to:1;dur:1000;loop:true;dir:alternate"></a-text>
  </a-entity>

</a-scene>

<div id="ui">
  <div id="topbar">
    <h1>⚡ AR Face</h1>
    <span>danielviafara.github.io</span>
  </div>
  <div id="bottom">
    <div id="effects-label">Selecciona un efecto</div>
    <div id="effects-grid">
      <button class="effect-btn active" onclick="setEffect('glasses')" id="btn-glasses">
        <span class="icon">🕶️</span><span class="lbl">Gafas</span>
      </button>
      <button class="effect-btn" onclick="setEffect('crown')" id="btn-crown">
        <span class="icon">👑</span><span class="lbl">Corona</span>
      </button>
      <button class="effect-btn" onclick="setEffect('dog')" id="btn-dog">
        <span class="icon">🐶</span><span class="lbl">Perro</span>
      </button>
      <button class="effect-btn" onclick="setEffect('cyber')" id="btn-cyber">
        <span class="icon">🤖</span><span class="lbl">Cyber</span>
      </button>
      <button class="effect-btn" onclick="setEffect('none')" id="btn-none">
        <span class="icon">✕</span><span class="lbl">Ninguno</span>
      </button>
    </div>
    <div id="capture-row">
      <button class="side-btn" onclick="openPreview()">🖼️</button>
      <button id="capture-btn" onclick="capturePhoto()">📸</button>
      <button class="side-btn" onclick="sharePhoto()">🔗</button>
    </div>
  </div>
</div>

<script>
  const effects = {
    glasses: ['glasses-left','glasses-right','glasses-bridge'],
    crown:   ['crown'],
    dog:     ['dog-nose','dog-ear-left','dog-ear-right'],
    cyber:   ['cyber-left','cyber-right','cyber-text'],
    none:    []
  };

  let lastPhotoDataUrl = null;

  function setEffect(name) {
    Object.values(effects).flat().forEach(id => {
      const el = document.getElementById(id);
      if (el) el.setAttribute('visible','false');
    });
    (effects[name] || []).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.setAttribute('visible','true');
    });
    document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btn-' + name);
    if (btn) btn.classList.add('active');
    showToast('Efecto: ' + name.charAt(0).toUpperCase() + name.slice(1));
  }

  function capturePhoto() {
    document.getElementById('flash').classList.add('active');
    setTimeout(() => document.getElementById('flash').classList.remove('active'), 150);
    try {
      const scene = document.querySelector('a-scene');
      const glCanvas = scene && scene.canvas;
      const video = document.querySelector('video');
      if (!glCanvas && !video) { showToast('⚠️ Cámara no lista'); return; }
      const w = glCanvas ? glCanvas.width : video.videoWidth;
      const h = glCanvas ? glCanvas.height : video.videoHeight;
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const ctx = out.getContext('2d');
      if (video && video.readyState >= 2) ctx.drawImage(video, 0, 0, w, h);
      if (glCanvas) { try { ctx.drawImage(glCanvas, 0, 0, w, h); } catch(e){} }
      lastPhotoDataUrl = out.toDataURL('image/png');
      showToast('📸 Foto capturada!');
    } catch(e) { showToast('⚠️ Error: ' + e.message); }
  }

  function openPreview() {
    if (!lastPhotoDataUrl) { showToast('Toma una foto primero 📸'); return; }
    document.getElementById('preview-img').src = lastPhotoDataUrl;
    document.getElementById('preview-modal').classList.add('show');
  }

  function closePreview() {
    document.getElementById('preview-modal').classList.remove('show');
  }

  function downloadPhoto() {
    if (!lastPhotoDataUrl) return;
    const a = document.createElement('a');
    a.href = lastPhotoDataUrl;
    a.download = 'ar-face-' + Date.now() + '.png';
    a.click();
    showToast('⬇️ Guardando...');
    closePreview();
  }

  async function sharePhoto() {
    if (!lastPhotoDataUrl) { showToast('Toma una foto primero 📸'); return; }
    try {
      const blob = await (await fetch(lastPhotoDataUrl)).blob();
      const file = new File([blob], 'ar-face.png', { type:'image/png' });
      if (navigator.share && navigator.canShare({ files:[file] })) {
        await navigator.share({ title:'AR Face - Daniel Viafara', files:[file] });
      } else { downloadPhoto(); }
    } catch(e) { downloadPhoto(); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
